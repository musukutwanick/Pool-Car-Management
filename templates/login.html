{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="auth-wrapper">
  <div class="auth-card">
    <div class="logos-card" style="margin-top:0;margin-bottom:18px;">
      <img src="{% static 'img/cellinsurance_thumb.png' %}" alt="Cell Insurance" class="logo-img"/>
      <img src="{% static 'img/cellmed_thumb.png' %}" alt="CellMed" class="logo-img"/>
      <img src="{% static 'img/nectacare_thumb.png' %}" alt="Nectacare" class="logo-img"/>
    </div>

    <h1 class="login-title">Welcome</h1>
    <p class="login-sub">Login to your dashboard</p>

    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-error">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="post" class="login-form">
      {% csrf_token %}
      <input type="text" name="username" class="form-input" placeholder="Enter your username or email" autocomplete="username" required>
      <input type="password" name="password" class="form-input" placeholder="Enter your password" autocomplete="current-password" required>
      <button type="submit" class="btn-primary">Log in</button>
    </form>
  </div>
</section>
{% endblock %}
